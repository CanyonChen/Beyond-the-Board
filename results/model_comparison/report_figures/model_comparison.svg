 <title id="model_comparison-title">Predictive performance on the verified cohort</title>
<desc id="model_comparison-desc">Development · three-window mean. Training prevalence 0.290600, Logistic regression 0.265527, XGBoost 0.240731, Histogram boosting 0.239866. Final week · 24–30 September. Training prevalence 0.287146, Logistic regression 0.262458, XGBoost 0.235851, Histogram boosting 0.235150. All three fitted models use full inputs and the zero-risk rule. The prevalence baseline predicts the training event rate. The final week was previously evaluated.</desc>
