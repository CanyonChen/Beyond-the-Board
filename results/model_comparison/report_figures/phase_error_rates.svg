 <title id="phase_error_rates-title">Observed final-week serious-error rates by game phase</title>
<desc id="phase_error_rates-desc">Opening: 1,468 serious errors in 49,954 moves (2.94%). Middlegame: 13,196 serious errors in 119,060 moves (11.08%). Endgame: 1,737 serious errors in 27,494 moves (6.32%). Overall: 16,401 serious errors in 196,508 moves (8.35%), 24–30 September.</desc>
