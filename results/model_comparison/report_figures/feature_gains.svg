 <title id="feature_gains-title">Incremental predictive value of clock information</title>
<desc id="feature_gains-desc">Final-week histogram gradient boosting with the zero-risk rule. Add both clocks: 0.000893 [0.000510, 0.001284]. Then add recent time use: 0.000125 [0.000006, 0.000246]. Both additions vs baseline: 0.001018 [0.000658, 0.001429]. Intervals are paired 95% percentiles from 1,000 whole-game resamples.</desc>
